<style>
/* Layout: observatory control room. Slim top bar; sky on the left; one panel for the current level on the right. Black dome, off-white text. */
:root{
  --night:#000;--panel:#0e0e0f;--panel-2:#1b1b1d;--rule:#3a3a3e;

}
html,body{background:var(--night);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}

.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}

textarea{width:100%;resize:vertical}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1440px;margin:0 auto 12px}

.dsec{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--rule)}

.code{font-family:var(--mono);font-size:18px;color:var(--amber);letter-spacing:.06em}
.formrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:14px}
.seg{border:1px solid var(--rule);border-radius:6px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.seg legend{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 4px}
.seg label{display:flex;gap:8px;align-items:baseline;font-size:15px}
.seg input{accent-color:var(--redlight)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}

td{padding:5px 6px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--rule)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--amber);padding:10px 16px;border-radius:6px;font-size:15px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.6)}

.tut{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}

.tut-box:focus{outline:none}
.tut-head{padding:18px 22px 12px;border-bottom:1px solid var(--rule)}
.tut-head h2{font-size:clamp(30px,4.4vw,44px);text-transform:uppercase;margin-top:4px}
.tut-body{padding:16px 22px 18px;display:flex;flex-direction:column;gap:12px}
.tut-body p,.tut-body li{max-width:68ch}
.tut-body b,.obs-body b,.lp b{color:var(--amber);font-weight:600}
.tcv{width:100%;height:240px;display:block;background:#050505;border:1px solid var(--rule);border-radius:4px}
.tcv.short{height:170px}
.tcv.tall{height:290px}
.tut-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px 16px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--panel)}
.tut-foot .sp{flex:1;font-size:14px;color:var(--muted)}
@media (max-width:520px){.tut-foot .sp{flex-basis:100%;order:-1}.tut-foot .sp:empty{display:none}.tut-foot #tSkip{margin-left:auto}.tut-head,.tut-body,.tut-foot{padding-left:16px;padding-right:16px}}
.defs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.defs li{padding:8px 12px;background:var(--panel-2);border-radius:4px}
.recipe{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.recipe li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:baseline}
.recipe li>div,.recipe li>span{display:block;min-width:0}
.recipe li .eq{margin-top:8px}
.recipe li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-size:24px;font-weight:800;color:var(--redlight);line-height:1}
.toggle{display:flex;flex-wrap:wrap;gap:6px}
.quiz{display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.q legend{padding:0 6px;font-weight:600;max-width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
#zoomFx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:opacity .35s}#zoomFx.live{pointer-events:auto;cursor:crosshair;touch-action:none}#zoomFx.grabbing{cursor:grabbing}.findtab{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.8)}
.findhud{position:absolute;left:12px;top:12px;max-width:min(460px,calc(100% - 24px));background:rgba(0,0,0,.78);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;z-index:5}.findhud h3{margin:2px 0 6px}.findhud p{margin:0 0 8px;font-size:14px}.findhud .row{margin-top:6px}#zoomFx.out{opacity:0}
.plot.zoom{cursor:crosshair;background:#000}
.builder{border:1px solid var(--rule);border-radius:6px;padding:12px;margin:10px 0;background:#050505}
.beq{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:14px 4px;color:var(--ink)}
.beq .bt{white-space:pre}
.msym{font-style:italic;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif}
.msym sub{font-style:normal;font-size:.6em}
.slot{min-width:2.1em;min-height:1.7em;border:2px dashed #6a6a72;border-radius:6px;background:#111;color:var(--ink);font:inherit;font-size:.95em;padding:0 6px;margin:0 2px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle}
.slot.fixed{border:none;background:none;cursor:default;padding:0 2px;min-width:0}.slot.full{border-style:solid;border-color:#8a8a92}.slot.over{border-color:#f6bd5f;background:#1d1a10}.slot.bad{border-color:#ff6a55;border-style:solid}
.bfr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}.bfr>span{display:flex;align-items:center;padding:3px 2px}.bfr>span:first-child{border-bottom:2px solid var(--ink)}
.bsq{display:inline-flex;align-items:stretch}.bsq .rad{font-size:1.6em;line-height:1}.bsq .und{display:inline-flex;align-items:center;border-top:2px solid var(--ink);padding:0 3px}
.bsup{font-size:.62em;display:inline-flex;align-items:center;align-self:flex-start;margin:0 1px}.bfr .bsup,.bsq .bsup{margin-top:-.2em}.bsup .slot{font-size:1.3em;min-height:1.4em}
.btray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}
.bchip{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:#111;border:1px solid #5a5a62;border-radius:8px;padding:5px 12px;font-size:20px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.bchip small{font-size:11px;font-family:var(--mono);color:var(--ink)}.bchip.sel{border-color:#f6bd5f;box-shadow:0 0 0 2px #f6bd5f55}.bchip.used{opacity:.3;cursor:default}

/* Welcome screen */

<body>
<header class="bar">
  <h1>Climbing the <span>Cosmic Ladder</span></h1>
  <nav class="levels" id="levels" aria-label="Levels"></nav>
  <div class="tools"><button class="iconbtn" id="menuBtn">Menu</button><button class="iconbtn gear" id="gearBtn" aria-label="Instructor settings" title="Instructor settings">&#9881;&#xFE0E;</button></div>
</header>

<main class="app">
  <section class="skywrap" aria-label="Night sky">
    <canvas id="sky" tabindex="0" aria-label="Sky. Drag or use arrow keys to pan. Click a marked object to observe it."></canvas>
    <p class="skyhint" id="skyhint"></p>
    <div class="obs" id="obs" hidden></div>
  </section>
  <aside class="lp" id="lp" aria-live="polite"></aside>
</main>
<div class="drawer" id="drawer" hidden><div class="drawer-box" id="drawerBox" tabindex="-1"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="tut" id="tut" hidden role="dialog" aria-modal="true" aria-labelledby="tutTitle"><div class="tut-box" id="tutBox" tabindex="-1"></div></div>
<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welTitle">
  <canvas id="wcv" aria-hidden="true"></canvas>
  <div class="wel-inner">
    <h1 class="wel-title" id="welTitle"><span>Climbing the</span><b>Cosmic Ladder</b></h1>
    <p class="wel-sub">Parallax → variable stars → Type 1a supernovae → the expanding universe</p>
    <button class="btn big" id="startBtn">Start game</button>
    <p class="wel-class" id="welClass"></p>
    <p class="wel-credit">Created by Dr. Alex Sobotka</p>
  </div>
</div>

<script>
/* ================= constants ================= */
const W=3600,H=2200,C=299792.458,LY=3.2616,MSUN=4.83,F10=1/(400*Math.PI),FOURPI=4*Math.PI;
const L_A=372.4,L_B=1,L_SN=4.6e9;
const mOf=F=>MSUN-2.5*Math.log10(F/F10);
const FOfm=m=>F10*Math.pow(10,-0.4*(m-MSUN));

/* ================= calibration ================= */
function plRel(){if(S.set.start>=2)return{A:L_A,b:L_B,n:0,given:true};
  const pts=Object.values(S.st.vars).map(v=>[Math.log10(v.P),Math.log10(v.L)]),n=pts.length;if(n<2)return null;
  const mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;let sxx=0,sxy=0;pts.forEach(([x,y])=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(y-my)});
  const b=sxx>1e-4?sxy/sxx:1,a=my-b*mx;return{A:Math.pow(10,a),b,n}}
const lumP=(rl,P)=>rl.A*Math.pow(P,rl.b);
const hostDist=(h,rl)=>rl?Math.sqrt(lumP(rl,h.P)/(FOURPI*h.Fc)):null;
function snCal(){if(S.set.start>=3)return{L:L_SN,n:0,given:true};const rl=plRel();if(!rl)return null;
  const vals=Object.values(S.st.hosts).map(h=>{const r=hostDist(h,rl);return FOURPI*r*r*h.Fpk});if(!vals.length)return null;
  const lg=vals.map(Math.log10),mu=lg.reduce((a,b)=>a+b,0)/lg.length,sd=lg.length>1?Math.sqrt(lg.reduce((a,b)=>a+(b-mu)**2,0)/(lg.length-1)):0;return{L:Math.pow(10,mu),n:vals.length,sd,vals}}
const farDist=(f,cal)=>cal?Math.sqrt(cal.L/(FOURPI*f.Fpk)):null;
function hubbleFit(){const cal=snCal();const pts=Object.values(S.st.far).map(f=>({d:farDist(f,cal)/1e6,v:f.z*C})).filter(p=>p.d);if(pts.length<3)return null;
  let sdd=0,svd=0;pts.forEach(p=>{sdd+=p.d*p.d;svd+=p.v*p.d});const Hf=svd/sdd;let ss=0;pts.forEach(p=>ss+=(p.v-Hf*p.d)**2);return{H:Hf,err:Math.sqrt(ss/(pts.length-1)/sdd),n:pts.length}}

const pulseDl=ph=>{ph=((ph%1)+1)%1;return ph<0.2?0.5-ph/0.2:-0.5+(ph-0.2)/0.8};
function lcCep(o,sig){const r=mulberry32(hashStr(S.seed+o.id+'c')),gs=gaussOf(r),Fm=o.L/(FOURPI*o.d*o.d),days=Math.max(12,Math.ceil(o.P*3.2)),step=o.P<4?0.25:o.P<8?0.5:1,lc=[];
  for(let t=0;t<=days;t+=step){if(r()<0.2)continue;lc.push({t:+t.toFixed(2),F:Fm*Math.pow(10,-0.32*pulseDl(t/o.P+o.ph))*(1+gs()*sig)})}return lc}
function lcSN(o){const r=mulberry32(hashStr(S.seed+o.id+'s')),gs=gaussOf(r),Fp=o.Lsn/(FOURPI*o.d*o.d),sig=0.02+0.04*o.d/4.2e8,lc=[];let t=-16+r()*2.5;
  while(t<=42){const dl=t<0?2.4*(t/18)**2:(t<=15?0.073*t:1.1+0.03*(t-15));lc.push({t:+(t+16).toFixed(1),F:Fp*Math.pow(10,-0.4*dl)*(1+gs()*sig)});t+=1.8+r()*2.2}return lc}

const BSYM={L:['L','L','luminosity'],Lsn:['L<sub>SN</sub>','L','supernova luminosity'],F:['F','F','flux'],Fpk:['F<sub>peak</sub>','F','supernova peak flux'],r:['r','r','distance'],d:['d','d','distance'],

const bsym=k=>`<span class="msym" style="color:${bcol(k)}">${BSYM[k][0]}</span>`;
function buildTpl(id,o){const fl=isFlux(),S_=k=>({s:k}),fr=(a,b)=>({fr:[a,b]}),sq=a=>({sq:a}),sp=a=>({sup:a});
  const T_={th:{t:[S_('th'),' = ',fr([S_('shift')],[S_('two')])],c:['th','shift','two','d','P'],h:'The parallax angle is what you are finding. It is half of the total shift.'},
    d:{t:[S_('d'),' [pc] = ',fr(['1 [AU]'],[S_('th'),' [arcsec]'])],c:['d','th','P','F','shift'],h:'You are solving for the distance. Parallax angle and distance are inversely related.'},
    L:fl?{t:[S_('L'),' = 4π',S_('r'),sp(['2']),' ',S_('F')],c:['L','r','F','P','th'],h:'You are solving for how much light the star gives off. You measured how much light reaches you and how far away it is.'}
      :{t:[S_('M'),' = ',S_('m'),' − 5 log₁₀',fr([S_('d')],['10 pc'])],c:['M','m','d','P'],h:'You are solving for how bright the star truly is, using how bright it looks and how far away it is.'},
    Lc:fl?{t:[S_('L'),` = ${o&&o.rel?sig3(o.rel.A):'A'} L☉ × `,S_('P'),sp([o&&o.rel?o.rel.b.toFixed(2):'b'])],c:['L','P','F','r'],h:'Your relation turns a pulsation period into a luminosity.'}
      :{t:[S_('M'),` = ${o&&o.relM?o.relM.a.toFixed(2):'a'} − ${o&&o.relM?Math.abs(o.relM.b).toFixed(2):'b'} log₁₀`,S_('P')],c:['M','P','m','d'],h:'Your relation turns a pulsation period into an absolute magnitude.'},

      :{t:[S_('d'),' = 10',sp(['(',S_('m'),' − ',S_('M'),' + 5)/5']),' pc'],c:['d','m','M','P'],h:'Now distance is the unknown. You know how bright the star truly is and how bright it looks.'},
    Lsn:fl?{t:[S_('Lsn'),' = 4π',S_('r'),sp(['2']),' ',S_('Fpk')],c:['Lsn','r','Fpk','F','P'],h:"You are finding the supernova's luminosity. Use its peak flux and the galaxy's distance."}
      :{t:[S_('Msn'),' = ',S_('mpk'),' − 5 log₁₀',fr([S_('d')],['10 pc'])],c:['Msn','mpk','d','m','P'],h:"You are finding the supernova's absolute magnitude. Use its peak magnitude and the galaxy's distance."},

      :{t:[S_('d'),' = 10',sp(['(',S_('mpk'),' − ',S_('Msn'),' + 5)/5']),' pc'],c:['d','mpk','Msn','M','m'],h:'Distance is the unknown. The supernova is a standard candle, so you know its absolute magnitude.'}};

const bExp=id=>((S.st.build||{})[id]||0)>=1;
function buildPlan(){const cur=S.cur;if(!cur.bplan){const ids=cardsFor(cur).map(c=>c.id).filter(id=>buildTpl(id,null)),fresh=ids.filter(id=>!bExp(id)),old=ids.filter(bExp);
  /* new equations are always built once; after that, about half of objects get one random equation to build, with only some boxes blank */
  cur.bplan=[...fresh];if(old.length&&Math.random()<(fresh.length?0.25:0.5))cur.bplan.push(old[Math.floor(Math.random()*old.length)])}return cur.bplan}
const needBuild=(c,ca)=>!!(S.set.drag&&S.cur&&!S.cur.review&&buildTpl(c.id,ca)&&!(S.cur.built||{})[c.id]&&buildPlan().includes(c.id)&&c.ready(ca));
const tplKeys=a=>a.flatMap(x=>typeof x==='string'?[]:x.s?[x.s]:x.fr?[...tplKeys(x.fr[0]),...tplKeys(x.fr[1])]:x.sq?tplKeys(x.sq):x.sup?tplKeys(x.sup):[]);

function builderHtml(c,ca){const tp=buildTpl(c.id,ca),st=bState(c);let n=0;const slots=[];
  if(!st.order)st.order=tp.c.map((_,i)=>i).sort(()=>Math.random()-0.5);
  if(!st.fixed){const keys=tplKeys(tp.t);st.fixed=[];if(bExp(c.id)&&keys.length>1){const idx=keys.map((_,i)=>i).sort(()=>Math.random()-0.5),blanks=1+Math.floor(Math.random()*Math.min(2,keys.length-1));st.fixed=idx.slice(blanks);st.fixed.forEach(i=>st.slots[i]=keys[i])}}
  const R=a=>a.map(x=>typeof x==='string'?`<span class="bt">${x}</span>`:x.s?(()=>{const i=n++;slots.push(x.s);const v=st.slots[i];return st.fixed.includes(i)?`<span class="slot fixed">${bsym(v)}</span>`:`<button type="button" class="slot${v?' full':''}${st.bad.includes(i)?' bad':''}" data-slot="${i}" aria-label="${v?'Box holding '+(BSYM[v][2]||BSYM[v][0])+'. Click to remove.':'Empty box'}">${v?bsym(v):'&nbsp;'}</button>`})()

  const full=Object.keys(st.slots).length===slots.length;
  return `<div class="builder"><p class="note"><b>Build the equation.</b> Drag each piece into a box, or tap a piece and then tap a box. ${st.fixed.length?'Some pieces are already in place. Fill in the empty boxes.':'Not every piece is used. The quantity you are solving for goes on the left.'}</p>
    <div class="beq">${eq}</div><div class="btray">${chips}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="bChk" ${full?'':'disabled'}>Check my equation</button><button type="button" class="btn ghost sm" id="bClr">Clear</button></div>${st.msg?`<p class="fb bad" role="status">${st.msg}</p>`:''}</div>`}
function mountBuilder(c,ca){const box=obsEl.querySelector('.builder');if(!box)return;const st=bState(c),cur=S.cur;

      if(drag.g){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';box.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));drag.g.hidden=true;const el=document.elementFromPoint(e.clientX,e.clientY);drag.g.hidden=false;const sl=el&&el.closest('.slot');if(sl)sl.classList.add('over')}});

  if(!cur.review){const c0=cardsFor(cur)[cur.i];if((c0.id==='findV'&&!cur.found.v)||(c0.id==='findSN'&&!cur.found.sn)){stopBlink();obsEl.hidden=true;obsEl.innerHTML='';startFind(c0.id==='findV'?'v':'sn');return}}

  const kindTxt=cur.kind==='var'?'Variable star in our galaxy':cur.kind==='host'?'Galaxy with a variable star and a supernova ★':`${o.type==='spiral'?'Spiral':'Elliptical'} galaxy with a supernova`;

const pulse=ph=>{ph=((ph%1)+1)%1;return ph<0.2?ph/0.2:1-(ph-0.2)/0.8};
function drawPulse(ctx,x,y,R,b,dim=1){const rr=R*(0.95+0.1*b),gR=rr*(1.6+1.4*b);const gl=ctx.createRadialGradient(x,y,0,x,y,gR);gl.addColorStop(0,`rgba(255,226,160,${(0.3+0.6*b)*dim})`);gl.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,gR,0,7);ctx.fill();
  const core=ctx.createRadialGradient(x-rr*.3,y-rr*.3,0,x,y,rr);core.addColorStop(0,`rgba(255,246,220,${dim})`);core.addColorStop(1,`rgba(230,${Math.round(140+70*b)},${Math.round(60+60*b)},${dim})`);ctx.fillStyle=core;ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill()}
const tutLines=(type,z=0)=>LINES.map(ln=>({...ln,amp:lineAmp({type},ln),lo:ln.l*(1+z)})).filter(ln=>ln.amp);
function strip(ctx,x,y,w,h,l0,l1,lines){for(let px=0;px<w;px++){ctx.fillStyle=wl2rgb(l0+(l1-l0)*px/w);ctx.fillRect(x+px,y,1.3,h)}
  for(const ln of lines){if(ln.lo<l0||ln.lo>l1)continue;const cx=x+(ln.lo-l0)/(l1-l0)*w,lw=Math.max(2,ln.w*2.4/(l1-l0)*w);ctx.fillStyle=ln.amp>0?`rgba(255,255,255,${Math.min(.95,.45+ln.amp*.5)})`:`rgba(0,0,0,${Math.min(.92,.45+Math.abs(ln.amp)*1.4)})`;ctx.fillRect(cx-lw/2,y,lw,h)}}

function lesson1(){const fl=isFlux();return{label:'Level 1 · Variable stars and parallax',finish:'Start Level 1',slides:[
{title:'A nearby variable star',html:`<p>Some stars pulsate, periodically getting brighter and dimmer. These are called <b>variable stars</b>. Here is one in our own galaxy, fairly close to us.</p>
<canvas class="tcv" id="tc" aria-label="Animated variable star and its light curve"></canvas>
<p>We can measure two things right away: its <b>pulsation period</b> (the time from one peak to the next) and how bright it appears to us. What we <b>don't</b> know yet is how bright it truly is, its ${fl?'luminosity':'absolute magnitude'}. How could we figure that out?</p>`,
mount(r){const cv=r.querySelector('#tc'),per=2.4,win=3*per;anim(t=>{const {ctx,w,h}=fitT(cv),sx=Math.min(w*0.15,90);drawPulse(ctx,sx,h/2-6,Math.min(26,h*0.12),pulse(t/per));ctx.fillStyle=TXT2;ctx.textAlign='center';ctx.fillText('variable star',sx,h-14);
  const x0=sx*2+24,x1=w-14,top=50,bot=h-32,Y=b=>bot-(b*0.85+0.05)*(bot-top),X=tt=>x1-(t-tt)/win*(x1-x0);ctx.strokeStyle=GRID;ctx.beginPath();ctx.moveTo(x0,top-8);ctx.lineTo(x0,bot);ctx.lineTo(x1,bot);ctx.stroke();ctx.fillStyle=TXT2;ctx.textAlign='right';ctx.fillText('Time →',x1,bot+18);ctx.fillStyle=CL.F;axisLabelY(ctx,fl?'Flux ↑':'brightness ↑',x0-10,(top+bot)/2);
  const peaks=[];for(let k=Math.floor((t-win)/per)-1;k<=Math.floor(t/per)+1;k++){const tp=(k+0.2)*per;if(tp>=t-win&&tp<=t)peaks.push(tp)}
  if(peaks.length>=2){const a=X(peaks[peaks.length-2]),b2=X(peaks[peaks.length-1]),yy=top-18;ctx.strokeStyle=CL.P;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a,yy);ctx.lineTo(b2,yy);ctx.moveTo(a,yy-5);ctx.lineTo(a,yy+5);ctx.moveTo(b2,yy-5);ctx.lineTo(b2,yy+5);ctx.stroke();ctx.lineWidth=1;ctx.fillStyle=CL.P;ctx.textAlign='center';ctx.fillText('pulsation period',(a+b2)/2,yy-8)}
  ctx.strokeStyle='#ff7a6b';ctx.lineWidth=1.8;ctx.beginPath();let first=true;for(let x=x0;x<=x1;x+=2){const y=Y(pulse((t-(x1-x)/(x1-x0)*win)/per));first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false}ctx.stroke();ctx.lineWidth=1})}},
fl?{title:'Flux vs. luminosity',html:`<ul class="defs"><li><b>Luminosity</b>: how much energy an object emits as light each second. In other words, how bright it truly is, like the wattage of a lightbulb.</li><li><b>Flux</b>: how much light we actually receive. How bright it appears.</li></ul>
<p>Light spreads out over a spherical area. A 20 Watt bulb stays 20 Watts, but the farther away it is, the fainter it appears. Move the bulb and watch.</p>
<canvas class="tcv" id="tc" aria-label="Looking down the line of sight at a 20 watt bulb that moves farther away and fades"></canvas>
<div class="slider"><label for="tD" class="eyebrow">Distance to the bulb</label><input type="range" id="tD" min="1" max="5" step="0.05" value="1.5"></div>
<p>How much light we receive depends on the star's luminosity and its distance from us. That is the <b>inverse square law</b>:</p>${EQ.inv}
<p>To use the "balancing scale" analogy, get rid of the fraction:</p>${EQ.bal}`,
mount(r){const cv=r.querySelector('#tc'),sl=r.querySelector('#tD');anim(()=>{const {ctx,w,h}=fitT(cv),d=+sl.value,looks=20/(d*d),b=1/(d*d);
  const vx=w/2,vy=h*0.3,gy=h-6,depth=k=>vy+(gy-vy)/(k*1.35);
  /* line-of-sight view: a road of light running away from you toward a vanishing point */
  const sk=ctx.createLinearGradient(0,0,0,vy);sk.addColorStop(0,'#000');sk.addColorStop(1,'#07070c');ctx.fillStyle=sk;ctx.fillRect(0,0,w,vy);
  ctx.strokeStyle='#26262c';ctx.lineWidth=1;for(let k=-6;k<=6;k++){ctx.beginPath();ctx.moveTo(vx+k*w*0.16,gy+40);ctx.lineTo(vx,vy);ctx.stroke()}
  for(let k=1;k<=5;k++){const y=depth(k),half=(y-vy)/(gy-vy)*w*0.9;ctx.strokeStyle=k===1?'#3a3a42':'#26262c';ctx.beginPath();ctx.moveTo(vx-half,y);ctx.lineTo(vx+half,y);ctx.stroke();ctx.fillStyle=CL.r;ctx.globalAlpha=.75;ctx.textAlign='left';ctx.fillText(k+'×',vx+half*0.55+4,y-3);ctx.globalAlpha=1}
  const by=depth(d)-6-50/d,R=24/d,gR=R*4.5;
  const gl=ctx.createRadialGradient(vx,by,0,vx,by,gR);gl.addColorStop(0,`rgba(255,230,160,${0.9*b})`);gl.addColorStop(1,'rgba(255,230,160,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(vx,by,gR,0,7);ctx.fill();
  ctx.fillStyle=`rgba(255,233,168,${0.25+0.75*b})`;ctx.beginPath();ctx.arc(vx,by,R,0,7);ctx.fill();ctx.fillStyle=`rgba(138,138,138,${0.3+0.7*b})`;ctx.fillRect(vx-R*0.5,by+R*0.85,R,R*0.85);
  ctx.strokeStyle=`rgba(138,138,138,${0.3+0.7*b})`;ctx.beginPath();ctx.moveTo(vx,by+R*1.7);ctx.lineTo(vx,depth(d));ctx.stroke();
  ctx.font='600 13px "IBM Plex Sans", sans-serif';ctx.textAlign='left';ctx.fillStyle=CL.L;ctx.fillText('20 Watt bulb',12,20);ctx.fillStyle=CL.r;ctx.fillText(`${d.toFixed(1)}× as far`,12,40);
  ctx.textAlign='right';ctx.fillStyle=CL.F;ctx.fillText(`looks like ${looks>=10?fmt(looks,0):fmt(looks,1)} Watts`,w-12,20);ctx.font=FONT;ctx.fillStyle=TXT2;ctx.fillText('your view down the line of sight',w-12,40)})}}
:{title:'Apparent vs. absolute magnitude',html:`<ul class="defs"><li><b>Absolute magnitude M</b>: how bright a star truly is. Defined as how bright it would look from 10 parsecs away.</li><li><b>Apparent magnitude m</b>: how bright it appears from Earth.</li></ul>
<p>Magnitudes run backwards: bigger numbers are fainter. A star looks fainter the farther away it is, so the difference between m and M tells you its distance:</p>${EQ.mag}<p>Or, solving for the distance:</p>${EQ.magd}`},
{title:'Parallax',html:`<p>Hold your thumb at arm's length and blink one eye, then the other. Your thumb seems to jump against the background. <b>Parallax</b> is the apparent shift in a star's position due to the motion of Earth. Your eyes are like Earth at different points in its orbit. Your thumb is like a nearby star. The target is the far away background stars.</p>
<canvas class="tcv tall" id="tc" aria-label="Earth orbiting the Sun and a nearby star shifting against background stars"></canvas>
<div class="slider"><label for="tD" class="eyebrow">Distance to the star</label><input type="range" id="tD" min="1" max="20" step="0.1" value="4"></div>
<p>The star's <b>parallax angle θ</b> is half of the total angle that it travels over the course of 6 months. A parsec is defined so that a star with a parallax angle of 1 arcsecond is 1 parsec away. To find the distance in parsecs:</p>${EQ.par}
<p class="note">Nearby stars have large parallax angles, while more distant stars have smaller ones. Parallax is only good out to about 500 parsecs. Every variable star in Level 1 is closer than that.</p>`,
mount(r){const cv=r.querySelector('#tc'),sl=r.querySelector('#tD');anim(t=>{const d=+sl.value,{ctx,w,h}=fitT(cv),sx=w*0.5,sy=h-60,R=Math.min(70,w*0.16),th=t*0.9,ex=sx+R*Math.cos(th),ey=sy+R*0.35*Math.sin(th),stY=sy-30-(d/20)*(h-150),bgY=26;
  ctx.fillStyle='#ffe066';for(let i=0;i<40;i++)ctx.fillRect(((i*97)%Math.max(1,w-20))+10,bgY-8+(i*37)%16,2,2);ctx.fillStyle=TXT2;ctx.textAlign='left';ctx.fillText('background stars',10,bgY+24);
  ctx.strokeStyle='#666';ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(sx,sy,R,R*0.35,0,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(sx,sy,9,0,7);ctx.fill();ctx.fillStyle=TXT2;ctx.textAlign='center';ctx.fillText('Sun',sx,sy+26);
  ctx.fillStyle='#86c9f2';ctx.beginPath();ctx.arc(ex,ey,5,0,7);ctx.fill();ctx.fillStyle=TXT;ctx.fillText('Earth',ex,ey-10);ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(sx,stY,5,0,7);ctx.fill();ctx.textAlign='left';ctx.fillText('nearby star',sx+10,stY+4);
  const ix=ex+(sx-ex)*(ey-bgY)/(ey-stY);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ix,bgY);ctx.stroke();
  ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(Math.max(4,Math.min(w-4,ix)),bgY,6,0,7);ctx.fill();ctx.textAlign='right';ctx.fillStyle=CL.th;ctx.fillText(`θ = ${(1/d).toFixed(3)}″`,w-10,h-10);ctx.fillStyle=CL.d;ctx.fillText(`d = ${d.toFixed(1)} pc   `,w-10-ctx.measureText(`θ = ${(1/d).toFixed(3)}″`).width,h-10)})}},
{title:'The plan',html:`<p>Henrietta Swan-Leavitt discovered that the pulsation period of a variable star is directly related to its ${fl?'luminosity':'absolute magnitude'}. In Level 1 you'll rediscover this yourself. For each nearby variable star:</p>
<ol class="recipe"><li><div><b>Measure the pulsation period</b> from its light curve.</div></li><li><div><b>Measure its average ${fl?'flux':'apparent magnitude'}</b>.</div></li>
<li><div><b>Measure its parallax angle</b> and turn it into a distance.${EQ.par}</div></li>
<li><div><b>Work out how bright it truly is.</b>${fl?EQ.bal:EQ.mag}</div></li><li><div><b>Plot it</b> on a chart of ${fl?'luminosity':'absolute magnitude'} against pulsation period.</div></li></ol>
<p>After ${S.set.n1} stars, you'll have your own <b>period-luminosity relation</b>, and Level 2 unlocks.</p>`},
{title:'Check yourself',gate:true,html:'<p>Answer these to start Level 1.</p><div class="quiz"></div>',mount(r){quiz(r,'l1',[
  fl?{q:'Star A and Star B are the same distance away. Star A has twice the luminosity of Star B. How much flux do we get from Star A?',o:['Four times the flux of Star B','Twice the flux of Star B','Half the flux of Star B','A fourth the flux of Star B'],a:1,f:['Not quite. They are at the same distance, so only the luminosity changes.','Right. Same distance, twice the luminosity, so twice the flux.','Not quite. More luminous means more flux.','Not quite. Distance did not change, so the flux scales with luminosity.']}
   :{q:'Star A and Star B have the same absolute magnitude. Star B is 10 times farther away. How do their apparent magnitudes compare?',o:['Star B is 5 magnitudes fainter','Star B is 10 magnitudes fainter','Star B is 5 magnitudes brighter','They look the same'],a:0,f:['Right. 10 times farther means 100 times fainter, which is 5 magnitudes.','Not quite. Every 5 magnitudes is a factor of 10 in distance.','Not quite. Farther away means fainter, which is a bigger magnitude.','Not quite. Distance changes how bright a star appears.']},
  fl?{q:'Star A and Star B have the same luminosity. Star B is twice as far away as Star A. How much flux do we get from Star B?',o:['4 times the flux of Star A','2 times the flux of Star A','½ times the flux of Star A','¼ times the flux of Star A'],a:3,f:['Not quite. Star B is farther, so it appears fainter.','Not quite. Star B is farther, so it appears fainter.','Close. The distance is squared in the inverse square law, so twice as far gives ¼ the flux.','Right. Twice as far, and the distance is squared: ¼ the flux.']}
   :{q:'A star is exactly 10 parsecs away. How do its apparent and absolute magnitudes compare?',o:['They are equal','m is 10 more than M','m is 5 more than M','m is 5 less than M'],a:0,f:['Right. M is defined as how bright the star would look from 10 pc, so m = M.','Not quite. At 10 pc the star is at the reference distance.','Not quite. At 10 pc the star is at the reference distance.','Not quite. At 10 pc the star is at the reference distance.']},
  {q:'Astronomers measure the parallax angle of a star to be 20″ (20 arcseconds). How far away is this star in parsecs?',o:['20 pc','5 pc','0.05 pc','0.02 pc'],a:2,f:['Not quite. Divide 1 by the parallax angle in arcseconds.','Not quite. Divide 1 by the parallax angle in arcseconds.','Right. 1 divided by 20 is 0.05 pc.','Not quite. Divide 1 by 20.']},
  {q:"Star X is 10 pc away. What is true about Star X's parallax angle?",o:['It is larger than 1″','It is smaller than 1″','It is equal to 1″','There is not enough information to tell'],a:1,f:['Not quite. Farther stars have smaller parallax angles. A star at 1 pc has 1″.','Right. It is farther than 1 pc, so its parallax angle is smaller than 1″ (0.1″).','Not quite. That would be a star 1 pc away.','You can tell: 1 divided by 10 gives 0.1″.']}])}}]}}

function lesson2(){const fl=isFlux(),g=S.set.start>=2;return{label:'Level 2 · Standard candles and supernovae',finish:'Start Level 2',slides:[
{title:'Standard candles',html:`<p>A <b>standard candle</b> is a special type of object that we know the ${fl?'luminosity':'absolute magnitude'} of.</p>
<p>Say we see a lightbulb very far away. We measure its brightness from our perspective: it looks like a 5 Watt bulb. If we know how bright the bulb actually is, say 20 Watts, we can determine the distance!</p>${fl?EQ.inv:EQ.magd}
<p>${g?'Astronomers have already worked out the period-luminosity relation for variable stars, so':'Thanks to the period-luminosity relation you built in Level 1,'} variable stars are now standard candles. If we can measure the pulsation period of a variable star, we can determine its ${fl?'luminosity':'absolute magnitude'}!</p>`},
{title:'Distance to a variable star',html:`<p>${fl?'Once you know L from the period and measure F, solve the inverse square law for r:':'Once you know M from the period and measure m, solve for the distance:'}</p>
${fl?E(String.raw`\begin{aligned} 4\pi ${T.r}^2 ${T.F} &= ${T.L} \\ ${T.r}^2 &= \frac{${T.L}}{4\pi ${T.F}} \\ ${T.r} &= \sqrt{\frac{${T.L}}{4\pi ${T.F}}} \end{aligned}`):EQ.magd}
<p>Worked example: a variable star in another galaxy has a pulsation period of 20 days. The period-luminosity relation says that means ${fl?'about 7,400 Suns':'an absolute magnitude of −4.85'}. Its average ${fl?'flux is tiny':'apparent magnitude is 26.20'}:</p>
${fl?E(String.raw`${T.r} = \sqrt{\frac{${cl('L','7{,}400')}\ L_\odot}{4\pi\,(${cl('F','3.5\\times10^{-12}')}\ ${FU})}} = ${cl('r','1.30\\times10^{7}')}\ \text{pc} = ${cl('r','13.0')}\ \text{Mpc}`):E(String.raw`${T.d} = 10^{(${cl('m','26.20')} - (${cl('M','-4.85')}) + 5)/5}\ \text{pc} = ${cl('d','1.62\\times10^{7}')}\ \text{pc} = ${cl('d','16.2')}\ \text{Mpc}`)}
<p class="note">1 Mpc (megaparsec) is a million parsecs, about 3.26 million light-years. Beyond about 40 Mpc, single variable stars are too faint to see.</p>`},
{title:'Type 1a supernovae',html:`<p>White dwarf stars cannot be larger than 1.4 solar masses. Any bigger, and the electron degeneracy pressure that supports them fails. If a white dwarf eats material from another star, it will exceed 1.4 solar masses and explode as a <b>Type 1a supernova</b>.</p>
<p>Astronomers are pretty sure that all Type 1a supernovae explode with the same brightness. In other words, they all have the same ${fl?'luminosity':'absolute magnitude'}. And they are so bright that we can see them in galaxies far beyond the reach of variable stars. <b>In Level 2 you'll test that claim and find out how bright they are.</b></p>`},
{title:'The plan',html:`<p>Some galaxies (marked ★ in the sky) have both a variable star you can measure and a Type 1a supernova. Everything in one galaxy is at the same distance. For each ★ galaxy:</p>
<ol class="recipe"><li><div><b>Measure the variable star's pulsation period</b> and use the period-luminosity relation to get its ${fl?'luminosity':'absolute magnitude'}.</div></li>
<li><div><b>Measure its average ${fl?'flux':'apparent magnitude'} and find the distance.</b>${fl?EQ.rsolve:EQ.magd}</div></li>
<li><div><b>Measure the supernova's peak ${fl?'flux':'apparent magnitude'}.</b> It is at the same distance.</div></li>
<li><div><b>Work out the supernova's ${fl?'luminosity':'absolute magnitude'}.</b>${fl?E(String.raw`${T.Lsn} = 4\pi ${T.r}^2\, ${T.Fpk}`):E(String.raw`${T.Msn} = ${T.mpk} - 5\log_{10}\!\left(\frac{${T.d}}{10\ \text{pc}}\right)`)}</div></li></ol>
<p>After ${S.set.n2} ★ galaxies, compare your supernovae. Do they really all have about the same ${fl?'luminosity':'absolute magnitude'}?</p>`},
{title:'Check yourself',gate:true,html:'<p>Answer these to start Level 2.</p><div class="quiz"></div>',mount(r){quiz(r,'l2',[
  {q:'At minimum, what two pieces of information do we need in order to determine the distance to a variable star?',o:[fl?"The star's flux and its temperature":"The star's apparent magnitude and its temperature",fl?"The star's flux and its pulsation period":"The star's apparent magnitude and its pulsation period","The star's size and its pulsation period",fl?"Just the star's flux":"Just the star's apparent magnitude"],a:1,
   f:['Not quite. Temperature does not tell us how bright the star truly is here.',`Right. The pulsation period gives how bright it truly is, and with how bright it appears we get the distance.`,'Not quite. We also need to measure how bright it appears.',"Not quite. Without knowing how bright it truly is, how bright it appears can't give the distance."]},
  fl?{q:"A variable star and a supernova are in the same galaxy. At its peak, the supernova's flux is 500,000 times the variable star's flux. How do their luminosities compare?",o:['The supernova is 500,000 times more luminous','The supernova is about 700 times more luminous','They have the same luminosity','You need to know the distance first'],a:0,f:['Right. Same galaxy, same distance, so the flux ratio equals the luminosity ratio.','Not quite. No square root is needed: the distance is the same for both.','Not quite. One looks far brighter at the same distance, so it truly is brighter.',"You don't: at the same distance, the flux ratio is the luminosity ratio."]}
   :{q:'A variable star and a supernova are in the same galaxy. At its peak, the supernova appears 14 magnitudes brighter than the variable star. How do their absolute magnitudes compare?',o:['The supernova is 14 magnitudes brighter','The supernova is 7 magnitudes brighter','They are the same','You need to know the distance first'],a:0,f:['Right. Same distance, so the difference in m equals the difference in M.','Not quite. No halving: both are at the same distance.','Not quite. One looks far brighter at the same distance, so it truly is brighter.',"You don't: at the same distance, the difference in m is the difference in M."]},
  {q:`Suppose your period-luminosity relation makes every variable star come out ${fl?'10% more luminous':'a little brighter'} than it really is. What happens to the supernova ${fl?'luminosities':'brightnesses'} you calculate?`,o:['They come out too high as well','They come out too low','Nothing, they are measured separately'],a:0,f:['Right. A too-bright standard candle makes the galaxy seem farther, which makes the supernova seem brighter too. Errors carry up the distance ladder.','Not quite. Think it through: brighter variable star, farther distance, brighter supernova.','Not quite. The supernova distance comes from the variable star, so errors carry over.']}])}}]}}

function lesson3(){const fl=isFlux(),cal=snCal();const Ltxt=cal?(fl?String.raw`${T.Lsn} \approx ${cl('L',tx(cal.L))}\ L_\odot`:String.raw`${T.Msn} \approx ${cl('M',t2(MOfL(cal.L)))}`):'';return{label:'Level 3 · Redshift and the Hubble diagram',finish:'Start Level 3',slides:[
{title:'Supernovae as standard candles',html:`<p>${S.set.start>=3?'Type 1a supernovae all have about the same peak':'In Level 2 you found that Type 1a supernovae all have about the same peak'} ${fl?'luminosity':'absolute magnitude'}:</p>${Ltxt?E(Ltxt):''}
<p>That makes every Type 1a supernova a standard candle. Catch one in a faraway galaxy, measure its peak ${fl?'flux':'apparent magnitude'}, and you have the distance to that galaxy, even hundreds of megaparsecs away:</p>${fl?E(String.raw`${T.r} = \sqrt{\frac{${T.Lsn}}{4\pi ${T.Fpk}}}`):E(String.raw`${T.d} = 10^{(${T.mpk} - ${T.Msn} + 5)/5}\ \text{pc}`)}
<p>The ${fl?'inverse square law':'distance formula'} tells us about the distance to galaxies. The <b>Doppler effect</b> tells us about their motion.</p>`},
{title:'The Doppler shift',html:`<p><b>Doppler shift</b>: the change in the wavelength of light as seen by an observer when the source of light is moving toward or away from the observer.</p>
<ul class="defs"><li>Moving <b>away</b> from us: the light gets stretched out. We say the light is <b>redshifted</b>.</li><li>Moving <b>toward</b> us: the light gets scrunched up. We say it is <b>blueshifted</b>.</li><li>The faster it moves, the more shifted its light. Moving side to side, there is no shift.</li></ul>
<canvas class="tcv" id="tc" aria-label="Lab spectrum compared with a shifted spectrum"></canvas>
<div class="slider"><label for="tV" class="eyebrow">Velocity (negative is toward us)</label><input type="range" id="tV" min="-30000" max="30000" step="500" value="9000"></div>`,
mount(r){const cv=r.querySelector('#tc'),sl=r.querySelector('#tV');anim(()=>{const v=+sl.value,{ctx,w,h}=fitT(cv),L=12,R=12,l0=350,l1=740,sw=w-L-R,X=l=>L+(l-l0)/(l1-l0)*sw,z=v/C,y1=24,y2=h-64,sh=32;
  ctx.fillStyle=TXT;ctx.textAlign='left';ctx.fillText('Not moving (lab on Earth)',L,16);strip(ctx,L,y1,sw,sh,l0,l1,tutLines('elliptical'));strip(ctx,L,y2,sw,sh,l0,l1,tutLines('elliptical',z));
  ctx.strokeStyle=v>=0?'rgba(255,106,85,.85)':'rgba(134,201,242,.9)';ctx.setLineDash([3,3]);tutLines('elliptical').forEach(ln=>{const lo=ln.l*(1+z);if(lo>l1||lo<l0)return;ctx.beginPath();ctx.moveTo(X(ln.l),y1+sh+2);ctx.lineTo(X(lo),y2-22);ctx.stroke()});ctx.setLineDash([]);
  ctx.fillStyle=v>0?'#ff6a55':v<0?'#86c9f2':TXT;ctx.fillText(v>0?`Moving away at ${fmt(v)} km/s: redshifted`:v<0?`Moving toward us at ${fmt(-v)} km/s: blueshifted`:'Not moving toward or away: no shift',L,y2-7);
  ctx.fillStyle=TXT2;ctx.textAlign='center';for(let l=400;l<=700;l+=50)ctx.fillText(l,X(l),h-12);ctx.textAlign='left';ctx.fillText('Blue',L,h-12);ctx.textAlign='right';ctx.fillText('Red',w-R,h-12)})}},
{title:"A galaxy's spectrum",html:`<p>A galaxy's light is the combined light of billions of stars, so its spectrum shows absorption lines from elements like calcium, hydrogen, magnesium and sodium. A spectrograph records it as a graph of flux against wavelength. Each dark absorption line becomes a <b>dip</b>. Galaxies still forming stars also have glowing gas that adds bright emission lines, which show up as <b>spikes</b>.</p>
<div class="toggle"><button class="chip" data-ty="elliptical" aria-pressed="true">Elliptical galaxy</button><button class="chip" data-ty="spiral" aria-pressed="false">Spiral galaxy</button></div>
<canvas class="tcv tall" id="tc" aria-label="Galaxy spectrum as a graph"></canvas>
<p class="note">In Level 3 you'll slide a template of these lines (at their lab wavelengths) until it lines up with each galaxy's spectrum.</p>`,
mount(r){const cv=r.querySelector('#tc');let type='elliptical';r.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;r.querySelectorAll('[data-ty]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  anim(()=>{const {ctx,w,h}=fitT(cv),L=40,R=12,l0=380,l1=700,X=l=>L+(l-l0)/(l1-l0)*(w-L-R),top=84,bot=h-38;strip(ctx,L,10,w-L-R,28,l0,l1,tutLines(type));
    const fs=[];for(let l=l0;l<=l1;l+=0.5)fs.push(specModel(type,0,l));const fmin=Math.min(...fs)-.05,fmax=Math.max(...fs)+.05,Y=f=>top+(1-(f-fmin)/(fmax-fmin))*(bot-top);
    ctx.strokeStyle=GRID;ctx.fillStyle=TXT2;ctx.textAlign='center';for(let l=400;l<=700;l+=50){const x=X(l);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.stroke();ctx.fillText(l,x,bot+16)}ctx.fillText('wavelength (nm)',L+(w-L-R)/2,h-4);ctx.fillStyle=CL.F;axisLabelY(ctx,'flux',16,(top+bot)/2);ctx.fillStyle=TXT2;
    let i=0;for(const ln of tutLines(type)){if(ln.n==='Ca H'||ln.n==='[N II]')continue;const x=X(ln.l),y=i++%2?58:73;ctx.strokeStyle=ln.amp>0?'rgba(134,220,174,.55)':'rgba(255,106,85,.5)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(x,y+3);ctx.lineTo(x,bot);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=ln.amp>0?'#86dcae':'#ff6a55';ctx.fillText(ln.n==='Ca K'?'Ca H&K':ln.n,x,y)}
    ctx.strokeStyle=TXT;ctx.lineWidth=1.3;ctx.beginPath();fs.forEach((f,k)=>{const x=X(l0+k*0.5),y=Y(f);k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.lineWidth=1})}},
{title:'From shift to speed',html:`<p>The faster a galaxy is moving away, the more its lines are shifted toward the red end of the spectrum. In Level 3 you'll line up a template of lines with each galaxy's spectrum. Once they match, the game reads off how far the lines shifted and tells you the galaxy's speed.</p>
<details class="more"><summary>For the curious: how the game turns a shift into a speed</summary><p class="note">It uses the redshift z, the fraction by which the light was stretched, and multiplies it by the speed of light c. This works well for galaxies moving much slower than light.</p>${EQ.z}${EQ.v}</details>`},
{title:'The Hubble diagram',html:`<p>For each galaxy you'll have two numbers: how far away it is, and how fast it is moving. Plot velocity against distance. If the universe is expanding, galaxies farther away move away faster, and the points fall along a straight line through the origin:</p>${EQ.hub}
<p>The slope of that line, <b>H₀</b>, is the Hubble constant. Its inverse gives a rough age for the universe. Measure ${S.set.n3} galaxies to finish the game, and you'll find out how close you got to the true value.</p>`},
{title:'Check yourself',gate:true,html:'<p>Answer these to start Level 3.</p><div class="quiz"></div>',mount(r){quiz(r,'l3',[
  {q:"Galaxy A's absorption lines are shifted a little toward the red. Galaxy B's lines are shifted a lot toward the red. Which galaxy is moving away from us faster?",o:['Galaxy A','Galaxy B','They move at the same speed','Neither is moving away'],a:1,f:['Not quite. A bigger shift means a faster speed.','Right. The faster a galaxy moves away, the more its light is stretched toward the red.','Not quite. Different shifts mean different speeds.','Not quite. A shift toward the red means moving away.']},
  {q:"A galaxy's absorption lines appear at shorter wavelengths than in a lab on Earth. What is the galaxy doing?",o:['Moving away from us','Moving toward us','Moving side to side','Not moving at all'],a:1,f:['Not quite. Moving away stretches the light to longer wavelengths.','Right. Shorter wavelengths mean the light is scrunched up: blueshifted, so it is moving toward us.','Not quite. Side to side motion gives no shift.','Not quite. A galaxy at rest shows lines at the lab wavelengths.']},
  {q:'Galaxy B is moving away from us twice as fast as galaxy A. If the Hubble law is true, galaxy B is…',o:['half as far away','at the same distance','about twice as far away','four times as far away'],a:2,f:['Not quite. Larger velocity goes with larger distance.','Not quite. Different velocities mean different distances.','Right. Velocity is proportional to distance. Your Hubble diagram will test this.','Not quite. It is a straight line, so twice v means twice r.']}])}}]}}
const LESSONS={l1:lesson1,l2:lesson2,l3:lesson3};
const tutEl=document.getElementById('tut'),tutBox=document.getElementById('tutBox');
function setTutOk(v){if(!TUT)return;TUT.ok=v;const n=tutBox.querySelector('#tNext'),hn=tutBox.querySelector('#tHint');if(n)n.disabled=!v;if(hn&&v&&TUT.L.slides[TUT.i].gate)hn.textContent='All correct. Nice work.'}

const KW_RE=/\b(luminosit(?:y|ies)|luminous|distances?|flux(?:es)?|(?:pulsation )?periods?)\b/gi,KW_SKIP='mjx-container,script,style,textarea,input,select,option,.btn,.chip,.lvl,.kw,canvas,svg,.eq,.code,title,.x';
const kwCol=w=>{w=w.toLowerCase();return w.startsWith('lum')?CL.L:w.startsWith('dist')?CL.r:/^(per|pul)/.test(w)?CL.P:CL.F};
function kwText(n){const t=n.nodeValue;if(!t||!/[a-z]/i.test(t))return;KW_RE.lastIndex=0;if(!KW_RE.test(t))return;const p=n.parentElement;if(!p||p.closest(KW_SKIP))return;
  KW_RE.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;while((m=KW_RE.exec(t))){if(m.index>last)f.appendChild(document.createTextNode(t.slice(last,m.index)));const sp=document.createElement('span');sp.className='kw';sp.style.color=kwCol(m[0]);sp.textContent=m[0];f.appendChild(sp);last=m.index+m[0].length}
  if(last<t.length)f.appendChild(document.createTextNode(t.slice(last)));n.replaceWith(f)}
function kwWalk(root){if(root.nodeType===3){kwText(root);return}if(root.nodeType!==1||root.closest(KW_SKIP))return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];while(tw.nextNode())list.push(tw.currentNode);list.forEach(kwText)}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')kwText(m.target);else m.addedNodes.forEach(kwWalk)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
kwWalk(document.body);

let startCode=parseCode(location.hash.slice(1))?.code;if(!startCode){try{startCode=localStorage.getItem('redshift-hunt:v3:code')}catch(e){}}
applyCode(startCode||DEFAULT_CODE);

/* ================= welcome screen ================= */
(function(){
  const wel=document.getElementById('welcome'),cv=document.getElementById('wcv'),ctx=cv.getContext('2d'),btn=document.getElementById('startBtn');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,R=mulberry32(1929);
  const prog=cnt('vars')+cnt('hosts')+cnt('far');btn.textContent=prog?'Continue climbing':'Start game';
  document.getElementById('welClass').textContent=`Class ${S.code}`;
  const spawn=z=>({x:(R()-.5)*7,y:(R()-.5)*4.2,z:z??(0.8+R()*1.6),rot:R()*Math.PI,q:.3+.6*R(),s:.6+R()*.9,arms:R()<.6});
  const gal=[];for(let i=0;i<90;i++)gal.push(spawn(1+R()*40));
  const bg=[];for(let i=0;i<280;i++)bg.push([R(),R(),R()]);
  let phase=0,last=null;
  function frame(now){
    if(wel.hidden)return;
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=r.width,h=r.height,W2=Math.round(w*dpr),H2=Math.round(h*dpr);
    if(cv.width!==W2||cv.height!==H2){cv.width=W2;cv.height=H2}
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const dt=last==null||reduce?0:Math.min(0.05,(now-last)/1000);last=now;
    const cx=w/2,vy=h*0.6,F=Math.min(w,h)*0.55;
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    for(const [a,b,c] of bg){ctx.fillStyle=`rgba(230,230,245,${0.12+c*0.45})`;ctx.fillRect(a*w,b*h,c>0.9?1.8:1.1,c>0.9?1.8:1.1)}
    const glow=ctx.createRadialGradient(cx,vy,0,cx,vy,Math.max(w,h)*0.45);glow.addColorStop(0,'rgba(150,45,30,.38)');glow.addColorStop(.4,'rgba(60,20,30,.15)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
    /* galaxies recede: speed proportional to distance (Hubble's law) */
    for(const g of gal){g.z*=1+0.16*dt;if(g.z>45)Object.assign(g,spawn())}
    gal.sort((a,b)=>b.z-a.z);
    for(const g of gal){const sx=cx+g.x/g.z*F,sy=vy+g.y/g.z*F,size=g.s*F*0.1/g.z;if(size<0.35||sx<-200||sx>w+200||sy<-200||sy>h+200)continue;
      const k=Math.min(1,Math.log(g.z)/Math.log(45)),col=`${Math.round(195+60*k)},${Math.round(215-120*k)},${Math.round(255-205*k)}`,al=Math.min(1,(1-k)*1.6)*Math.min(1,(g.z-0.8)*2.5);
      ctx.save();ctx.translate(sx,sy);ctx.rotate(g.rot);ctx.scale(1,g.q);
      const gr=ctx.createRadialGradient(0,0,0,0,0,size);gr.addColorStop(0,`rgba(255,246,232,${al})`);gr.addColorStop(.22,`rgba(${col},${al*.65})`);gr.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,size,0,7);ctx.fill();
      if(g.arms&&size>14){ctx.fillStyle=`rgba(${col},${al*.35})`;for(let arm=0;arm<2;arm++)for(let t=0;t<1;t+=0.03){const th=t*4.2+arm*Math.PI,rr=size*(0.15+0.75*t);ctx.beginPath();ctx.arc(Math.cos(th)*rr,Math.sin(th)*rr,Math.max(.6,size*.045),0,7);ctx.fill()}}
      ctx.restore()}
    /* the ladder, receding to the vanishing point */
    const halfW=Math.min(w*0.17,190),base=h+10,P=(side,z)=>{const s=1/(1+z);return[cx+side*halfW*s,vy+(base-vy)*s]};
    ctx.save();ctx.shadowColor='rgba(246,189,95,.6)';ctx.shadowBlur=14;ctx.lineCap='round';
    for(const side of [-1,1]){const a=P(side,0),b=P(side,80),grd=ctx.createLinearGradient(0,base,0,vy);grd.addColorStop(0,'rgba(246,189,95,.95)');grd.addColorStop(.75,'rgba(246,189,95,.35)');grd.addColorStop(1,'rgba(246,189,95,0)');
      ctx.strokeStyle=grd;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
    phase=(phase+dt*0.5)%1;
    for(let i=0;i<70;i++){const z=(i+1-phase)*0.5;if(z<=0)continue;const s=1/(1+z),l=P(-1,z),rr=P(1,z),a=Math.max(0,1-z/22);if(a<=0)break;
      ctx.strokeStyle=`rgba(246,189,95,${a})`;ctx.lineWidth=Math.max(0.6,7*s);ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(rr[0],rr[1]);ctx.stroke()}
    ctx.restore();
    if(!reduce)requestAnimationFrame(frame)}
  requestAnimationFrame(frame);if(reduce)window.addEventListener('resize',()=>requestAnimationFrame(frame));
  btn.onclick=()=>{startMusic();sfx('start');wel.hidden=true;maybeLesson();if(!TUT&&tutEl.hidden)sky.focus({preventScroll:true})};
  setTimeout(()=>btn.focus({preventScroll:true}),50);
})();
</script>
